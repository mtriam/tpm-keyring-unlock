name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -buildvcs=false -trimpath -ldflags="-s -w" -o tpm-keyring-unlock-linux-${{ matrix.goarch }} .

      - name: Checksum
        run: |
          sha256sum tpm-keyring-unlock-linux-${{ matrix.goarch }} > tpm-keyring-unlock-linux-${{ matrix.goarch }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpm-keyring-unlock-linux-${{ matrix.goarch }}
          path: |
            tpm-keyring-unlock-linux-${{ matrix.goarch }}
            tpm-keyring-unlock-linux-${{ matrix.goarch }}.sha256
