name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, örn: v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build \
              -buildvcs=false \
              -trimpath \
              -ldflags="-s -w" \
              -o tpm-keyring-unlock-linux-${{ matrix.goarch }} .

      - name: checksum
        run: |
          sha256sum tpm-keyring-unlock-linux-${{ matrix.goarch }} \
            > tpm-keyring-unlock-linux-${{ matrix.goarch }}.sha256

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpm-keyring-unlock-linux-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            tpm-keyring-unlock-linux-${{ matrix.goarch }}
            tpm-keyring-unlock-linux-${{ matrix.goarch }}.sha256

  release:
    needs: linux
    runs-on: ubuntu-latest

    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*