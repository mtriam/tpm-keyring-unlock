name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="-s -w" -o tpm-keyring-unlock .

      - name: Checksum
        run: |
          sha256sum tpm-keyring-unlock > tpm-keyring-unlock.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpm-keyring-unlock-linux-amd64
          path: |
            tpm-keyring-unlock
            tpm-keyring-unlock.sha256
